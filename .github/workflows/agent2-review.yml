name: Agent 2 - Review and Merge Activity PRs

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  review:
    # Safety guard: only ever touch PRs from the activity/* branches opened by
    # the agent1 workflow. Never auto-approves/merges real feature PRs.
    if: startsWith(github.event.pull_request.head.ref, 'activity/') && github.event.pull_request.user.login == 'mansuri-sabit'
    runs-on: ubuntu-latest
    environment: bot
    steps:
      - name: Approve PR
        env:
          GH_TOKEN: ${{ secrets.AGENTBOT }}
        run: |
          gh pr review "${{ github.event.pull_request.number }}" \
            --approve \
            --body "LGTM - automated activity update." \
            --repo "${{ github.repository }}"

      - name: Merge PR
        env:
          GH_TOKEN: ${{ secrets.AGENTBOT }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --squash \
            --delete-branch \
            --repo "${{ github.repository }}"
