name: Agent 1 - Propose Activity Update

on:
  schedule:
    # 09:15 UTC on Mon/Wed/Fri — adjust days/time as you like
    - cron: '15 9 * * 1,3,5'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AGENT1_PAT }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "mansuri-sabit"
          git config user.email "241449375+mansuri-sabit@users.noreply.github.com"

      - name: Create branch
        id: branch
        run: |
          BRANCH="activity/$(date -u +%Y-%m-%d)-${{ github.run_number }}"
          git checkout -b "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Append activity log entry
        run: |
          mkdir -p docs
          FILE=docs/activity-log.md
          [ -f "$FILE" ] || echo "# Activity Log" > "$FILE"
          NOTES=(
            "Reviewed dependency versions for drift."
            "Verified build passes on a clean checkout."
            "Noted a small doc clarification for later."
            "Checked open issues for staleness."
            "Confirmed lint config still matches CI."
          )
          IDX=$(( $(date -u +%j) % ${#NOTES[@]} ))
          echo "- $(date -u +%Y-%m-%d): ${NOTES[$IDX]}" >> "$FILE"

      - name: Commit
        run: |
          git add docs/activity-log.md
          git commit -m "chore(activity): daily log update"

      - name: Push branch
        run: git push origin HEAD:${{ steps.branch.outputs.name }}

      - name: Open PR
        env:
          GH_TOKEN: ${{ secrets.AGENT1_PAT }}
        run: |
          gh pr create \
            --title "chore(activity): daily log update" \
            --body "Automated small activity-log update." \
            --base main \
            --head "${{ steps.branch.outputs.name }}"
